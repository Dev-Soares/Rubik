# Dev (padrão):  pnpm dev          -> postgres + server + client, todos em container, com hot reload
# Prod local:    pnpm docker:prod  -> imagens de produção (nginx + node)

services:
  postgres:
    image: postgres:17-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d appdb']
      interval: 2s
      timeout: 5s
      retries: 15

  # Storage S3-compatível para as fotos de chamado. Em produção troque por S3
  # ou R2 — o server só conhece as variáveis `S3_*`, não o MinIO.
  minio:
    image: minio/minio:latest
    container_name: app-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      # Console web: http://localhost:9001
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 15

  # Cria o bucket no primeiro `pnpm dev` e sai. Sem isto o primeiro upload
  # falha com NoSuchBucket, que parece erro de credencial e não é.
  minio-init:
    image: minio/mc:latest
    container_name: app-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/app-tickets"

  server:
    profiles: ['dev']
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    container_name: app-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      # `postgres` é o hostname do serviço na rede do compose, não localhost.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/appdb
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-local-com-mais-de-32-caracteres}
      CORS_ORIGIN: http://localhost:3001
      LOG_LEVEL: debug
      SWAGGER_USER: admin
      SWAGGER_PASSWORD: admin
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-dev-integration-key-com-mais-de-32-caracteres}
      # Vazio: o envio ao sistema externo fica desligado no dev padrão.
      TICKET_WEBHOOK_URL: ${TICKET_WEBHOOK_URL:-}
      TICKET_WEBHOOK_API_KEY: ${TICKET_WEBHOOK_API_KEY:-}
      TICKET_WEBHOOK_PROJECT_ID: ${TICKET_WEBHOOK_PROJECT_ID:-}
      # `minio` é o hostname do serviço na rede do compose.
      S3_REGION: us-east-1
      S3_BUCKET: app-tickets
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
    volumes:
      # Código do host -> container (hot reload).
      - ./server/src:/app/server/src
      - ./server/package.json:/app/server/package.json
      - ./server/tsconfig.json:/app/server/tsconfig.json
      - ./server/tsconfig.build.json:/app/server/tsconfig.build.json
      - ./server/nest-cli.json:/app/server/nest-cli.json
      - ./server/drizzle.config.ts:/app/server/drizzle.config.ts
      # Volumes anônimos: preservam o node_modules do container (binários Linux),
      # senão o bind mount do host (binários Windows) sobrescreveria.
      - /app/node_modules
      - /app/server/node_modules
      # Sem volume em /app/server/dist: o nest usa deleteOutDir e não consegue
      # remover um diretório que é ponto de montagem (EBUSY).
    ports:
      - '3000:3000'
      # drizzle-kit studio (pnpm db:studio)
      - '4983:4983'

  client:
    profiles: ['dev']
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    container_name: app-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:3000
      DOCKER: 'true'
    volumes:
      # `client` inteiro num único mount: o gerador de rotas do TanStack escreve
      # em `.tanstack/tmp` e renomeia por cima de `src/routeTree.gen.ts`. Com um
      # mount por arquivo, origem e destino caem em dispositivos diferentes e o
      # rename morre com EXDEV.
      - ./client:/app/client
      - /app/node_modules
      - /app/client/node_modules
    ports:
      - '3001:3001'

  # ---- Imagens de produção (perfil `prod`) ----

  server-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/appdb
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: info
    ports:
      - '3000:3000'

  client-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - server-prod
    ports:
      - '8080:80'

volumes:
  postgres_data:
  minio_data:
