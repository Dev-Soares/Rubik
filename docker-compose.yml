# Dev (padrão):  pnpm dev          -> postgres + server + client em container, com hot reload.
#                                     O server migra e cria o admin antes de subir a API
#                                     (ver o CMD de `server/Dockerfile.dev`), então este é
#                                     o único comando necessário num clone novo.
# Prod local:    pnpm docker:prod  -> imagens de produção (nginx + node)
#
# Portas do HOST vêm do `.env` da raiz, com o padrão aqui como default. Quem
# escreve esse arquivo é `scripts/ports.mjs`, que roda antes de todo comando de
# dev e desvia para a próxima porta livre quando a padrão está ocupada por outro
# projeto da máquina. A porta INTERNA de cada serviço nunca muda: o que conversa
# na rede do compose (`postgres:5432`, `server:3000`) é fixo de propósito.

services:
  postgres:
    image: postgres:17-alpine
    container_name: rubik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rubikdb
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rubikdb']
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    profiles: ['dev']
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    container_name: rubik-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      # `postgres` é o hostname do serviço na rede do compose, não localhost.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rubikdb
      # Estas duas são vistas pelo BROWSER, então seguem a porta do HOST, não a
      # interna: o cookie de sessão e a checagem de CORS comparam com a origem
      # que o navegador realmente usou.
      BETTER_AUTH_URL: http://localhost:${SERVER_PORT:-3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-local-com-mais-de-32-caracteres}
      CORS_ORIGIN: http://localhost:${CLIENT_PORT:-3001}
      LOG_LEVEL: debug
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-dev-integration-key-com-mais-de-32-caracteres}
      # Vazio: o envio ao sistema externo fica desligado no dev padrão.
      TICKET_WEBHOOK_URL: ${TICKET_WEBHOOK_URL:-}
      TICKET_WEBHOOK_API_KEY: ${TICKET_WEBHOOK_API_KEY:-}
      TICKET_WEBHOOK_PROJECT_ID: ${TICKET_WEBHOOK_PROJECT_ID:-}
      # Storage das fotos de chamado. Vazio no dev padrão: o upload de foto fica
      # desligado e o resto da aplicação roda normalmente. Para ligar, aponte
      # para um bucket real (AWS S3 ou R2) no `.env` da raiz.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes:
      # Código do host -> container (hot reload).
      - ./server/src:/app/server/src
      - ./server/package.json:/app/server/package.json
      - ./server/tsconfig.json:/app/server/tsconfig.json
      - ./server/tsconfig.build.json:/app/server/tsconfig.build.json
      - ./server/nest-cli.json:/app/server/nest-cli.json
      - ./server/drizzle.config.ts:/app/server/drizzle.config.ts
      # Volumes anônimos: preservam o node_modules do container (binários Linux),
      # senão o bind mount do host (binários Windows) sobrescreveria.
      - /app/node_modules
      - /app/server/node_modules
      # Sem volume em /app/server/dist: o nest usa deleteOutDir e não consegue
      # remover um diretório que é ponto de montagem (EBUSY).
    ports:
      - '${SERVER_PORT:-3000}:3000'
      # drizzle-kit studio (pnpm db:studio)
      - '${STUDIO_PORT:-4983}:4983'

  client:
    profiles: ['dev']
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    container_name: rubik-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # O bundle roda no browser do host, então a API é o localhost DELE.
      VITE_API_URL: http://localhost:${SERVER_PORT:-3000}
      DOCKER: 'true'
    volumes:
      # `client` inteiro num único mount: o gerador de rotas do TanStack escreve
      # em `.tanstack/tmp` e renomeia por cima de `src/routeTree.gen.ts`. Com um
      # mount por arquivo, origem e destino caem em dispositivos diferentes e o
      # rename morre com EXDEV.
      - ./client:/app/client
      - /app/node_modules
      - /app/client/node_modules
    ports:
      - '${CLIENT_PORT:-3001}:3001'

  # ---- Imagens de produção (perfil `prod`) ----

  server-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rubikdb
      BETTER_AUTH_URL: http://localhost:${SERVER_PORT:-3000}
      # Os defaults abaixo existem para o smoke test local das imagens de
      # produção passar pelos portões de `env.ts`. Num deploy real cada um vem
      # do gerenciador de segredo do ambiente — nunca destes valores.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-smoke-test-local-secret-com-mais-de-32-caracteres}
      CORS_ORIGIN: http://localhost:${CLIENT_PROD_PORT:-8080}
      LOG_LEVEL: info
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-smoke-test-local-integration-key-32-chars}
      TICKET_WEBHOOK_URL: ${TICKET_WEBHOOK_URL:-}
      TICKET_WEBHOOK_API_KEY: ${TICKET_WEBHOOK_API_KEY:-}
      TICKET_WEBHOOK_PROJECT_ID: ${TICKET_WEBHOOK_PROJECT_ID:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports:
      - '${SERVER_PORT:-3000}:3000'

  client-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:${SERVER_PORT:-3000}
    restart: unless-stopped
    depends_on:
      - server-prod
    ports:
      - '${CLIENT_PROD_PORT:-8080}:80'

volumes:
  postgres_data:
